[package]
name = "camilladsp-config"
version = "5.0.0"
authors = ["Henrik Enquist <henrik.enquist@gmail.com>"]
edition = "2024"
description = "Configuration types, validation and coefficient file reading for CamillaDSP"
rust-version = "1.90"
license = "GPL-3.0-only OR MPL-2.0"
repository = "https://github.com/HEnquist/camilladsp"

[features]
# These only decide which device types the config accepts. The camilladsp
# features of the same names enable them.
pipewire-backend = []
dummy-backend = []
# OpenAPI schemas for the config types and the protocol types a client passes
# on, for the GUI's API spec. camilladsp does not enable it.
utoipa = ["dep:utoipa"]

# The sample precision is a raw rustc cfg, see CamillaFloat. RUSTFLAGS applies to
# every crate in the build, so this crate always agrees with camilladsp on it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(camillafloat_f32)'] }

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
yaml_serde = "0.10.3"
serde_path_to_error = "0.1"
log = "0.4.14"
parking_lot = "0.12.1"
audioadapter = "5.0.0"
audioadapter-sample = "5.1.0"
waveadapter = "0.3.0"
serde_json = "1.0"
utoipa = { version = "6.0.0", optional = true }
