# Runs on a change to the engine, the shared e2e fixtures or this backend, and skips a
# change that is only inside another backend. ASIO rides along, and so does the dummy
# backend, which the rate adjust tests use as the second clock.
on:
  push:
    paths: &paths
      - src/**
      - "!src/alsa_backend/**"
      - "!src/coreaudio_backend/**"
      - "!src/pipewire_backend/**"
      - Cargo.*
      - testscripts/e2e/*
      - testscripts/e2e/wasapi/**
      - .github/workflows/e2e_wasapi.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

name: End-to-end, WASAPI and ASIO

# Kept separate from ci_test.yml so a flaky device job can never block the lint and
# unit test signal. One workflow per backend, so each can get its own path filter.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The wasapi tests, on VB-Cable, which also carry the ASIO backend through the
  # Steinberg built-in ASIO Driver on top of the cable. The driver pack is fetched from
  # the vendor at run time and installed through SetupAPI, with no devcon and no reboot,
  # see testscripts/e2e/wasapi/install_vbcable.ps1. The free cable is a single one, so
  # every test runs one way through it.
  wasapi:
    name: WASAPI, VB-Cable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      # Capture is behind the microphone privacy setting. Without it a capture does not
      # fail, it delivers silence.
      - name: Start the audio service and allow microphone access
        run: |
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name LetAppsAccessMicrophone -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Install VB-Cable
        run: |
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vbcable"
          testscripts/e2e/wasapi/install_vbcable.ps1 -Dir "$env:RUNNER_TEMP\vbcable"
          Get-PnpDevice -FriendlyName '*CABLE*' | Format-Table Class, Status, FriendlyName -AutoSize

      # Steinberg's free generic ASIO driver, for the ASIO backend. It has no settings
      # file and opens the Windows default devices, which on the runner can only be the
      # cable.
      - name: Install the Steinberg built-in ASIO Driver
        run: |
          $zip = "$env:RUNNER_TEMP\steinberg_asio.zip"
          Invoke-WebRequest https://download.steinberg.net/static_content/runtime-components/asio/1.0.9.26-1973a36d-45e1-3b89-b1ba-ee79d9eb03a8/Steinberg_built_in_ASIO_Driver.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\steinberg_asio"
          $msi = Get-ChildItem "$env:RUNNER_TEMP\steinberg_asio" -Recurse -Filter *64bit.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exit code $($p.ExitCode)" }
          Get-Item 'HKLM:\SOFTWARE\ASIO\Steinberg built-in ASIO Driver'

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasapi

      # The WASAPI and ASIO backends are in every Windows build. The dummy backend is
      # for the rate adjust tests, where a drifting Dummy device is the second clock.
      - name: Build
        run: cargo build --profile e2e --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client numpy sounddevice

      - name: Run the WASAPI tests
        run: pytest -v testscripts/e2e -m wasapi --basetemp "$env:RUNNER_TEMP\pytest"

      - name: Keep the configs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wasapi-configs
          path: ${{ runner.temp }}/pytest
