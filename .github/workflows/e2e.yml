on: [push, pull_request]

name: End-to-end tests

# Kept separate from ci_test.yml so a flaky device job can never block the lint and
# unit test signal.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the whole binary on the test-only dummy devices, which need no sound card,
  # no kernel module and no driver, so this works on a stock runner.
  dummy_backend:
    name: Dummy backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pacing tests run here and nowhere else. What they cover, the rate
          # control loop and the buffer accounting, is portable code with no cfg in it,
          # so one OS proves the logic. The stock, alsa, coreaudio and wasapi tests are
          # deselected everywhere, since they need another build, a VM, BlackHole or
          # VB-Cable, and have jobs of their own below.
          - os: ubuntu-latest
            pytest_args: -m "not stock and not alsa and not coreaudio and not wasapi"
          - os: macos-latest
            pytest_args: -m "not stock and not alsa and not coreaudio and not wasapi and not pacing"
          - os: windows-latest
            pytest_args: -m "not stock and not alsa and not coreaudio and not wasapi and not pacing"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Alsa devel
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The e2e profile is optimised, see Cargo.toml. An unoptimised build cannot
      # resample a chunk inside a chunk period, and a device that cannot keep up
      # produces underruns and missed deadlines that say nothing about the code.
      - name: Build with the dummy backend
        run: cargo build --profile e2e --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client numpy

      # The tests find the build above on their own, CAMILLADSP_BIN only overrides that.
      - name: Run the end-to-end tests
        run: pytest -v testscripts/e2e ${{ matrix.pytest_args }}

  # The same suite's `stock` marked tests, against a build with no dummy-backend feature,
  # which is the binary a release ships. They cover the file, wav, stdio and generator
  # devices, so they need no hardware either.
  software_backends:
    name: Software backends, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the file backend is not one implementation. Linux reads through
        # `NonBlockingReader` and everything else through `BlockingReader`, see
        # src/file_backend/mod.rs, so one runner covers one of them. Windows stands for
        # the second, and is also where a byte stream through stdin or stdout is most
        # likely to be mangled. macOS shares the Windows reader and adds nothing here.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Alsa devel
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: stock

      # No --features, which is the whole point of this job.
      - name: Build without the dummy backend
        run: cargo build --profile e2e

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client numpy

      - name: Run the software backend tests
        run: pytest -v testscripts/e2e -m stock

  # The alsa tests, on snd-aloop and snd-dummy. The runner's azure kernel is built
  # without sound, so no package can bring the modules, and this boots an Ubuntu minimal
  # cloud image under KVM instead, which runs the generic kernel. The binary is built on
  # the runner and copied in, and so is the suite, so the VM needs no Rust toolchain.
  # The guest is the same Ubuntu release as the runner, which keeps the binary's glibc
  # requirement satisfied.
  #
  # Both ALSA backends, since the threaded one is a separate implementation rather than
  # an option on the other. The steps before the tests check each thing the suite
  # depends on in turn, so a runner or image change fails there and says which.
  alsa:
    name: ALSA, ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: alsa
            features: ""
          - backend: threaded-alsa
            features: --features threaded-alsa
    env:
      IMAGE_URL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Make KVM usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and ALSA devel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils libasound2-dev

      - name: Boot the VM
        run: |
          curl -sSfL -o base.img "$IMAGE_URL"
          qemu-img create -f qcow2 -F qcow2 -b base.img vm.qcow2 6G
          ssh-keygen -q -t ed25519 -N '' -f vm_key
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys:
            - $(cat vm_key.pub)
          EOF
          echo "instance-id: e2e" > meta-data
          cloud-localds seed.img user-data meta-data
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName localhost
            Port 2222
            User ubuntu
            IdentityFile $PWD/vm_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ConnectTimeout 5
          EOF
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 2048 \
            -drive file=vm.qcow2,if=virtio \
            -drive file=seed.img,if=virtio,format=raw \
            -nic user,model=virtio,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none -serial file:console.log -daemonize
          start=$(date +%s)
          until ssh vm true 2>/dev/null; do
            if [ $(( $(date +%s) - start )) -gt 300 ]; then
              echo "no ssh after 300 s"
              exit 1
            fi
            sleep 2
          done
          echo "ssh up after $(( $(date +%s) - start )) s"
          ssh vm cloud-init status --wait || echo "cloud-init status $?"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}

      - name: Build
        run: cargo build --profile e2e ${{ matrix.features }}

      - name: Check the guest kernel has the modules
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          uname -r
          grep -E "^CONFIG_(SND_ALOOP|SND_DUMMY)=" "/boot/config-$(uname -r)"
          EOF

      - name: Load snd-aloop and snd-dummy, and install the test dependencies
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          sudo apt-get update -q
          # The minimal image ships linux-modules without the sound drivers.
          if ! modinfo snd-aloop snd-dummy >/dev/null 2>&1; then
            sudo apt-get install -y -q --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo apt-get install -y -q --no-install-recommends alsa-utils \
            python3-pytest python3-pytest-timeout python3-numpy python3-websocket
          sudo modprobe snd-aloop pcm_substreams=2
          sudo modprobe snd-dummy
          # The default user of the minimal image is not in the audio group, and nobody
          # may ask for real time priority. Both apply from the next ssh login on.
          sudo usermod -aG audio ubuntu
          printf '@audio - rtprio 95\n@audio - memlock unlimited\n' \
            | sudo tee /etc/security/limits.d/95-audio.conf
          cat /proc/asound/cards
          EOF

      - name: Check the devices open as the guest user
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          id
          ulimit -r
          aplay -l | grep -E "Loopback|Dummy"
          arecord -q -D hw:Loopback,1,0 -f S16_LE -r 48000 -c 2 -t raw -d 1 /dev/null
          EOF

      - name: Copy the binary and the suite into the guest
        run: |
          scp -q target/e2e/camilladsp vm:
          tar -C testscripts -cf - --exclude=__pycache__ e2e | ssh vm tar -xf -

      - name: Run the ALSA tests
        run: ssh vm 'cd e2e && CAMILLADSP_BIN=$HOME/camilladsp python3 -m pytest -v -m alsa .'

      - name: Guest console on failure
        if: failure()
        run: cat console.log || true

  # The coreaudio tests, on BlackHole 2ch and 16ch. A HAL plugin rather than a kernel
  # extension, so the casks install on a stock runner with no reboot, and the runner's
  # processes already have the microphone permission capture needs. The installer asks
  # for a reboot, and what it actually takes is a restart of coreaudiod.
  #
  # Apple silicon only. The backend has no architecture specific code and BlackHole is
  # one universal binary, and the probe found the Intel runner behaving the same.
  coreaudio:
    name: CoreAudio, BlackHole
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install BlackHole 2ch and 16ch
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          brew list --cask --versions | grep -i blackhole

      - name: Restart coreaudiod until both devices are listed
        run: |
          sudo killall coreaudiod || true
          start=$(date +%s)
          until system_profiler SPAudioDataType | grep -q "BlackHole 16ch" \
              && system_profiler SPAudioDataType | grep -q "BlackHole 2ch"; do
            if [ $(( $(date +%s) - start )) -gt 60 ]; then
              system_profiler SPAudioDataType
              echo "BlackHole not listed after 60 s"
              exit 1
            fi
            sleep 2
          done
          system_profiler SPAudioDataType

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coreaudio

      # No --features, the CoreAudio backend is in every macOS build.
      - name: Build
        run: cargo build --profile e2e

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client numpy sounddevice

      - name: Run the CoreAudio tests
        run: pytest -v testscripts/e2e -m coreaudio

  # The wasapi tests, on VB-Cable, which also carry the ASIO backend through the
  # Steinberg built-in ASIO Driver on top of the cable. The driver pack is fetched from
  # the vendor at run time and installed through SetupAPI, with no devcon and no reboot,
  # see testscripts/e2e/wasapi/install_vbcable.ps1. The free cable is a single one, so
  # every test runs one way through it.
  wasapi:
    name: WASAPI, VB-Cable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      # Capture is behind the microphone privacy setting. Without it a capture does not
      # fail, it delivers silence.
      - name: Start the audio service and allow microphone access
        run: |
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name LetAppsAccessMicrophone -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Install VB-Cable
        run: |
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vbcable"
          testscripts/e2e/wasapi/install_vbcable.ps1 -Dir "$env:RUNNER_TEMP\vbcable"
          Get-PnpDevice -FriendlyName '*CABLE*' | Format-Table Class, Status, FriendlyName -AutoSize

      # Steinberg's free generic ASIO driver, for the ASIO backend. It has no settings
      # file and opens the Windows default devices, which on the runner can only be the
      # cable.
      - name: Install the Steinberg built-in ASIO Driver
        run: |
          $zip = "$env:RUNNER_TEMP\steinberg_asio.zip"
          Invoke-WebRequest https://download.steinberg.net/static_content/runtime-components/asio/1.0.9.26-1973a36d-45e1-3b89-b1ba-ee79d9eb03a8/Steinberg_built_in_ASIO_Driver.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\steinberg_asio"
          $msi = Get-ChildItem "$env:RUNNER_TEMP\steinberg_asio" -Recurse -Filter *64bit.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exit code $($p.ExitCode)" }
          Get-Item 'HKLM:\SOFTWARE\ASIO\Steinberg built-in ASIO Driver'

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasapi

      # The WASAPI and ASIO backends are in every Windows build. The dummy backend is
      # for the rate adjust tests, where a drifting Dummy device is the second clock.
      - name: Build
        run: cargo build --profile e2e --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client numpy sounddevice

      - name: Run the WASAPI tests
        run: pytest -v testscripts/e2e -m wasapi --basetemp "$env:RUNNER_TEMP\pytest"

      - name: Keep the configs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wasapi-configs
          path: ${{ runner.temp }}/pytest
