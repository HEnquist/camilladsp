on: [push, pull_request]

name: End-to-end tests

# Kept separate from ci_test.yml so a flaky device job can never block the lint and
# unit test signal.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the whole binary on the test-only dummy devices, which need no sound card,
  # no kernel module and no driver, so this works on a stock runner.
  dummy_backend:
    name: Dummy backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pacing tests run here and nowhere else. What they cover, the rate
          # control loop and the buffer accounting, is portable code with no cfg in it,
          # so one OS proves the logic and the other two would only be paying runner
          # time to measure their own scheduler. Windows sleeps in steps of about 15 ms
          # without timeBeginPeriod and has the slowest runners in the pool, and the
          # macos runners often wait a long time to start. The smoke test still checks
          # the pacer against the clock on all three.
          - os: ubuntu-latest
            pytest_args: ""
          - os: macos-latest
            pytest_args: -m "not pacing"
          - os: windows-latest
            pytest_args: -m "not pacing"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Alsa devel
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with the dummy backend
        run: cargo build --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client

      # The tests find target/debug/camilladsp on their own, CAMILLADSP_BIN only
      # overrides that.
      - name: Run the end-to-end tests
        run: pytest -v testscripts/e2e ${{ matrix.pytest_args }}
