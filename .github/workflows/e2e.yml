on: [push, pull_request]

name: End-to-end tests

# Kept separate from ci_test.yml so a flaky device job can never block the lint and
# unit test signal.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the whole binary on the test-only dummy devices, which need no sound card,
  # no kernel module and no driver, so this works on a stock runner.
  dummy_backend:
    name: Dummy backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Alsa devel
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with the dummy backend
        run: cargo build --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client

      # The tests find target/debug/camilladsp on their own, CAMILLADSP_BIN only
      # overrides that.
      - name: Run the end-to-end tests
        run: pytest -v testscripts/e2e
