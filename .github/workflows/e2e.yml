on: [push, pull_request]

name: End-to-end tests

# Kept separate from ci_test.yml so a flaky device job can never block the lint and
# unit test signal.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the whole binary on the test-only dummy devices, which need no sound card,
  # no kernel module and no driver, so this works on a stock runner.
  dummy_backend:
    name: Dummy backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pacing tests run here and nowhere else. What they cover, the rate
          # control loop and the buffer accounting, is portable code with no cfg in it,
          # so one OS proves the logic.
          - os: ubuntu-latest
            pytest_args: ""
          - os: macos-latest
            pytest_args: -m "not pacing"
          - os: windows-latest
            pytest_args: -m "not pacing"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Alsa devel
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The e2e profile is optimised, see Cargo.toml. An unoptimised build cannot
      # resample a chunk inside a chunk period, and a device that cannot keep up
      # produces underruns and missed deadlines that say nothing about the code.
      - name: Build with the dummy backend
        run: cargo build --profile e2e --features dummy-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout websocket-client

      # The tests find the build above on their own, CAMILLADSP_BIN only overrides that.
      - name: Run the end-to-end tests
        run: pytest -v testscripts/e2e ${{ matrix.pytest_args }}
