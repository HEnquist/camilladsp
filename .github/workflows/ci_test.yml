on: [push, pull_request]

name: CI test and lint

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check_lint_test_linux_amd64:
    name: Check test and lint Linux
    runs-on: ubuntu-latest
    #container: ubuntu:20.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Update package list
        run: sudo apt-get update

      - name: Install utils
        run: sudo apt-get install curl wget -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Alsa devel
        run: sudo apt-get install libasound2-dev -y

      - name: Install PipeWire and D-Bus development files
        run: sudo apt-get install libpipewire-0.3-dev libdbus-1-dev -y

      - name: Install OpenSSL
        run: sudo apt-get install openssl libssl-dev -y

      - name: Run cargo check
        run: cargo check

      - name: Run cargo check nodefault
        run: cargo check --no-default-features

      - name: Run cargo test with all supported backends
        run: cargo test --features pipewire-backend

      - name: Run cargo test with all optional features
        run: cargo test --features debug,secure-websocket

      # The sample precision is a rustc cfg, not a Cargo feature, so it is not
      # covered by --features or --all-features and needs its own run.
      - name: Run cargo test with f32 sample precision
        run: cargo test
        env:
          RUSTFLAGS: --cfg camillafloat_f32

      - name: Run cargo clippy with f32 sample precision
        run: cargo clippy --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg camillafloat_f32

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  check_test_aarch64:
    name: Check and test Linux arm 64bit
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Update package list
        run: sudo apt-get update

      - name: Install utils
        run: sudo apt-get install curl wget -y

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Alsa devel
        run: sudo apt-get install libasound2-dev -y

      - name: Run cargo check
        run: cargo check

      - name: Run cargo test
        run: cargo test

      # The NEON kernels exist in both precisions, so this is the runner that
      # covers the f32 SIMD convolution path end to end.
      - name: Run cargo test with f32 sample precision
        run: cargo test
        env:
          RUSTFLAGS: --cfg camillafloat_f32

      - name: Run cargo clippy with f32 sample precision
        run: cargo clippy --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg camillafloat_f32

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  # Cross compiled in a Debian container rather than with the `cross` tool.
  # Debian serves armhf from the normal archive, so enabling the armhf
  # multiarch is all that is needed to get the ALSA headers and libraries.
  # The container release also sets the glibc floor of the released binary,
  # so keep it no newer than the oldest Raspberry Pi OS release to support.
  check_test_armv7:
    name: Check and test Linux armv7
    runs-on: ubuntu-latest
    container: debian:bookworm
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
      PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      # The tests are armv7 binaries, so they have to run under emulation.
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm-static
    steps:
      - name: Install armhf cross toolchain
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git pkg-config \
            build-essential crossbuild-essential-armhf \
            libasound2-dev:armhf qemu-user-static

      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --target armv7-unknown-linux-gnueabihf

      - name: Run cargo test for arm
        run: cargo test --target armv7-unknown-linux-gnueabihf

  check_test_and_lint_windows:
    name: Check and test Windows
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --no-default-features

      - name: Run cargo test
        run: cargo test --no-default-features

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo clippy with ASIO backend
        run: cargo clippy --features asio-backend -- -D warnings

  check_test_macos:
    name: Check and test macOS Intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --no-default-features

      - name: Run cargo test
        run: cargo test --no-default-features

  check_test_and_lint_macos_arm:
    name: Check and test macOS Arm
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --no-default-features

      - name: Run cargo test
        run: cargo test --no-default-features

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings




