on:
  push:
    paths:
      - .github/workflows/alsa_loopback_probe.yml
  workflow_dispatch:

name: ALSA loopback probe

# The runner's azure kernel is built with CONFIG_SOUND unset, so snd-aloop cannot be
# loaded on the runner itself, whatever package is installed. Instead this boots an
# Ubuntu minimal cloud image under KVM, which runs the generic kernel, and loads the
# module there. The binary is built on the runner and copied in, so the VM needs no
# Rust toolchain. The guest is the same Ubuntu release as the runner, which keeps the
# binary's glibc requirement satisfied.
#
# Every step prints what it finds and the job only fails where a later suite would fail
# too. The checks are meant to move into the real snd-aloop job, so it fails early and
# says why when the loopback can't be enabled.
env:
  IMAGE_URL: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img

jobs:
  probe:
    name: snd-aloop in a VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Is KVM available
        run: |
          ls -l /dev/kvm
          # The runner user is not in the kvm group, the usual fix for hosted runners.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and ALSA devel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils libasound2-dev

      - name: Download the image
        run: |
          curl -sSfL -o base.img "$IMAGE_URL"
          qemu-img info base.img
          qemu-img create -f qcow2 -F qcow2 -b base.img vm.qcow2 6G

      - name: Boot the VM
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm_key
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys:
            - $(cat vm_key.pub)
          EOF
          echo "instance-id: probe" > meta-data
          cloud-localds seed.img user-data meta-data
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName localhost
            Port 2222
            User ubuntu
            IdentityFile $PWD/vm_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ConnectTimeout 5
          EOF
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 2048 \
            -drive file=vm.qcow2,if=virtio \
            -drive file=seed.img,if=virtio,format=raw \
            -nic user,model=virtio,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none -serial file:console.log -daemonize
          start=$(date +%s)
          until ssh vm true 2>/dev/null; do
            if [ $(( $(date +%s) - start )) -gt 300 ]; then
              echo "no ssh after 300 s"
              cat console.log
              exit 1
            fi
            sleep 2
          done
          echo "ssh up after $(( $(date +%s) - start )) s"
          ssh vm cloud-init status --wait || echo "cloud-init status $?"

      # No --features, the release shape of the binary. Runs while nothing else needs
      # the runner, but after the boot so a broken image fails fast.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: stock

      - name: Build
        run: cargo build --profile e2e

      - name: Is the guest kernel built with ALSA
        run: |
          ssh vm 'uname -a; grep -E "^(# )?CONFIG_(SOUND|SND|SND_PCM|SND_TIMER|SND_ALOOP|SND_DUMMY)[= ]" /boot/config-$(uname -r); id'

      - name: Load snd-aloop in the guest
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          if ! modinfo snd-aloop snd-dummy >/dev/null 2>&1; then
            echo "snd-aloop or snd-dummy is not in linux-modules, installing linux-modules-extra"
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo apt-get install -y -q --no-install-recommends alsa-utils
          sudo modprobe snd-aloop pcm_substreams=2
          sudo modprobe snd-dummy
          # The minimal image's default user is not in the audio group. Every step is a
          # new ssh login, so the group applies from the next one on.
          sudo usermod -aG audio ubuntu
          cat /proc/asound/cards
          ls -l /dev/snd
          EOF

      - name: Can the guest user see the devices
        run: ssh vm 'aplay -l; arecord -l'

      - name: Hardware parameters of the devices
        run: |
          ssh vm bash -s <<'EOF'
          for dev in hw:Loopback,0,0 hw:Dummy; do
            echo "== playback $dev"
            aplay -D $dev --dump-hw-params -d 1 -f S16_LE -r 48000 -c 2 /dev/zero 2>&1 | sed -n '/HW Params/,/^---/p'
          done
          echo "== capture hw:Loopback,1,0, with the playback end idle"
          arecord -D hw:Loopback,1,0 --dump-hw-params -d 1 -f S16_LE -r 48000 -c 2 /dev/null 2>&1 | sed -n '/HW Params/,/^---/p'
          echo "== capture hw:Loopback,1,0, with the playback end running S16_LE 44100"
          aplay -q -D hw:Loopback,0,0 -f S16_LE -r 44100 -c 2 -t raw -d 3 /dev/zero &
          sleep 0.5
          arecord -D hw:Loopback,1,0 --dump-hw-params -d 1 -f S16_LE -r 44100 -c 2 /dev/null 2>&1 | sed -n '/HW Params/,/^---/p'
          wait
          amixer -c Loopback contents | grep -A2 -E "name='PCM (Notify|Slave|Rate)" | head -40
          EOF

      - name: Roundtrip through the loopback with alsa-utils
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          head -c 384000 /dev/urandom > in.raw
          arecord -q -D hw:Loopback,1,0 -f S16_LE -r 48000 -c 2 -t raw -d 3 out.raw &
          rec=$!
          sleep 0.5
          aplay -q -D hw:Loopback,0,0 -f S16_LE -r 48000 -c 2 -t raw in.raw
          wait $rec
          python3 - <<'PY'
          data = open("out.raw", "rb").read()
          src = open("in.raw", "rb").read()
          nonzero = sum(1 for b in data if b)
          print(f"captured {len(data)} bytes, {nonzero} nonzero")
          print("input found in capture:", src[:4096] in data)
          assert nonzero > 0, "capture is silent"
          PY
          EOF

      - name: Play through the loopback with camilladsp
        run: |
          scp -q target/e2e/camilladsp vm:
          ssh vm bash -s <<'EOF'
          set -e
          ./camilladsp --version
          cat > loopback.yml <<'YML'
          devices:
            samplerate: 48000
            chunksize: 1024
            capture:
              type: SignalGenerator
              channels: 2
              signal:
                type: Sine
                freq: 1000
                level: -6.0
            playback:
              type: Alsa
              channels: 2
              device: "hw:Loopback,0,0"
              format: S16_LE
          YML
          arecord -q -D hw:Loopback,1,0 -f S16_LE -r 48000 -c 2 -t raw -d 3 tone.raw &
          rec=$!
          timeout 5 ./camilladsp -v loopback.yml > camilladsp.log 2>&1 || status=$?
          wait $rec
          echo "camilladsp exit status ${status:-0}"
          tail -20 camilladsp.log
          python3 - <<'PY'
          import array, math
          s = array.array("h", open("tone.raw", "rb").read())
          left = s[0::2]
          peak = max(abs(v) for v in left) / 32768
          crossings = sum(1 for a, b in zip(left, left[1:]) if a < 0 <= b)
          seconds = len(left) / 48000
          print(f"{seconds:.2f} s captured, peak {20 * math.log10(peak or 1e-9):.1f} dBFS, "
                f"{crossings / seconds:.0f} rising zero crossings per s")
          assert peak > 0.25, "capture has no tone"
          PY
          EOF

      # The intended shape of the real suite: capture from the loopback, which the test
      # feeds, and play to snd-dummy, so both sides are real ALSA devices with two
      # independent clocks. The probe only asks whether it opens both and keeps
      # running, timeout's 124 means it was still going when killed.
      - name: Capture from the loopback and play to snd-dummy with camilladsp
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          cat > dummy.yml <<'YML'
          devices:
            samplerate: 48000
            chunksize: 1024
            capture:
              type: Alsa
              channels: 2
              device: "hw:Loopback,1,0"
              format: S16_LE
            playback:
              type: Alsa
              channels: 2
              device: "hw:Dummy"
              format: S16_LE
          YML
          aplay -q -D hw:Loopback,0,0 -f S16_LE -r 48000 -c 2 -t raw -d 6 /dev/urandom &
          feed=$!
          sleep 0.5
          timeout 4 ./camilladsp -v dummy.yml > dummy.log 2>&1 || status=$?
          kill $feed 2>/dev/null || true
          echo "camilladsp exit status ${status:-0}"
          tail -30 dummy.log
          test "${status:-0}" = 124
          EOF

      # snd-dummy has no knob for its clock, so a skewed sink is a second loopback cable
      # whose far end nobody opens, with its own rate shift set by the test. The rate
      # shift is per cable and named after the cable's capture end, so the sink played
      # through 0,1 is controlled by device=1,subdevice=1. The backend only writes the
      # control of its own capture cable, 1,0, so the two do not clash. Rate adjust
      # should pull the capture cable's shift to the sink's.
      - name: Rate adjust on the loopback capture against a skewed sink
        run: |
          ssh vm bash -s <<'EOF'
          set -e
          amixer -c Loopback cset iface=PCM,name='PCM Rate Shift 100000',device=1,subdevice=1 100200
          amixer -c Loopback cget iface=PCM,name='PCM Rate Shift 100000',device=1,subdevice=1
          cat > skew.yml <<'YML'
          devices:
            samplerate: 48000
            chunksize: 1024
            enable_rate_adjust: true
            adjust_interval_s: 1.0
            capture:
              type: Alsa
              channels: 2
              device: "hw:Loopback,1,0"
              format: S16_LE
            playback:
              type: Alsa
              channels: 2
              device: "hw:Loopback,0,1"
              format: S16_LE
          YML
          aplay -q -D hw:Loopback,0,0 -f S16_LE -r 48000 -c 2 -t raw -d 32 /dev/urandom &
          feed=$!
          sleep 0.5
          timeout 30 ./camilladsp -v skew.yml > skew.log 2>&1 &
          dsp=$!
          sleep 28
          echo "capture cable rate shift after 28 s:"
          amixer -c Loopback cget iface=PCM,name='PCM Rate Shift 100000',device=1,subdevice=0 | tail -1 | tee shift.txt
          wait $dsp || status=$?
          kill $feed 2>/dev/null || true
          echo "camilladsp exit status ${status:-0}"
          grep -E 'Setting capture loopback speed|rror|nderrun|verrun' skew.log | tail -30
          grep -q 'Setting capture loopback speed' skew.log
          test "${status:-0}" = 124
          shift=$(sed -E 's/.*values=//' shift.txt)
          echo "capture shift $shift, sink shift 100200"
          test "$shift" -gt 100100 -a "$shift" -lt 100300
          EOF

      - name: Guest console on failure
        if: failure()
        run: cat console.log || true
