on: [push, pull_request]

name: Check websocket docs are up to date

concurrency:
  group: ws-docs-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check_ws_docs:
    name: Regenerate websocket.md and check for diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install ALSA development files
        run: sudo apt-get update && sudo apt-get install libasound2-dev -y

      - name: Install Python dependencies
        run: pip install jinja2 pyyaml

      - name: Regenerate websocket.md
        run: python3 scripts/gen_ws_docs.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code websocket.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same-repo events have a writable token, so open a PR with the fix.
      # Fork PRs get a read-only token and can't push, so they skip this and
      # fall through to the failure step below with manual instructions.
      - name: Open PR with regenerated docs
        id: cpr
        if: >-
          steps.diff.outputs.changed == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: websocket.md
          branch: auto/regenerate-ws-docs
          base: ${{ github.head_ref || github.ref_name }}
          commit-message: Regenerate websocket.md
          title: Regenerate websocket.md
          body: |
            `websocket.md` was out of date with the generator. This PR contains the
            regenerated file.

            Generated by the "Check websocket docs are up to date" workflow. Merge this
            into the source branch, or run `python3 scripts/gen_ws_docs.py` locally and
            commit the result instead.

      - name: Fail if out of date
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo ""
          if [ -n "${{ steps.cpr.outputs.pull-request-url }}" ]; then
            echo "websocket.md is out of date. Opened a PR with the regenerated file:"
            echo "  ${{ steps.cpr.outputs.pull-request-url }}"
            echo "Merge it into this branch, or run 'python3 scripts/gen_ws_docs.py' and commit the result."
          else
            echo "websocket.md is out of date. Run 'python3 scripts/gen_ws_docs.py' and commit the result."
          fi
          exit 1
