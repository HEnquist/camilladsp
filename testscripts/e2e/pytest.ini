[pytest]
# Every test here drives a real process, so a hang is a plausible failure mode, and a
# hung test would otherwise sit there until the CI job itself times out. This one line
# turns every test in the suite into a hang check as well. Needs pytest-timeout.
timeout = 120

# Tests whose assertions depend on how accurately time is kept, not merely on time
# passing. CI runs them on Linux only: what they cover is portable code, so the other
# two runners would be measuring their own schedulers. `test_dummy_smoke.py` still
# checks on every OS that the pacer tracks the clock at all.
markers =
    pacing: asserts on timing accuracy, run on Linux only in CI
