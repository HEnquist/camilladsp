[pytest]
# Fail a hung test rather than leaving it to the CI job timeout. Needs pytest-timeout.
timeout = 120

markers =
    pacing: asserts on timing accuracy, runs best on a quiet machine
    stock: needs a build without the dummy-backend feature, which is what a release ships
    alsa: needs snd-aloop and snd-dummy loaded, runs in a VM in CI, see alsa/conftest.py
    coreaudio: needs BlackHole 2ch and 16ch installed, see coreaudio/conftest.py
